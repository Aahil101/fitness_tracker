<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Pulse">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6750A4" />
      <stop offset="1" stop-color="#45307A" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#bg)" />
  <!-- gauge track: 180deg, flat side up -->
  <path d="M14 40a18 18 0 0 1 36 0" fill="none" stroke="#ffffff" stroke-opacity="0.28"
        stroke-width="6" stroke-linecap="round" />
  <!-- filled progress -->
  <path d="M14 40a18 18 0 0 1 22.6-17.4" fill="none" stroke="#00BECD" stroke-width="6"
        stroke-linecap="round" />
  <!-- goal marker -->
  <path d="M44.9 26.3l4.4-3.2" stroke="#FF6E5A" stroke-width="3.4" stroke-linecap="round" />
  <circle cx="32" cy="40" r="3.4" fill="#ffffff" fill-opacity="0.92" />
</svg>
