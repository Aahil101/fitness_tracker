# Render blueprint for the FastAPI backend.
# Free web services sleep after ~15 minutes idle; the first request after that
# takes a few seconds to wake. Fine for a private group, surprising if unexpected.
services:
  - type: web
    name: fitness-tracker-api
    runtime: python
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: '3.12.7'
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      # Set these in the Render dashboard — never commit real values.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      # Additional keys, comma separated. The app fails over between them when
      # one is exhausted or refused — see backend/app/services/keypool.py.
      - key: GEMINI_API_KEYS
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_API_KEYS
        sync: false
      # 2.5-flash answers keys from older projects and 404s newer ones with "no
      # longer available to new users", so a mixed pool needs a model all of the
      # keys can reach.
      - key: GEMINI_MODEL
        value: gemini-3.5-flash
      - key: USDA_API_KEY
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      # Comma-separated. Add your Vercel production domain here.
      - key: CORS_ORIGINS
        sync: false
